[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitaita-oracle"
version = "0.1.0"
description = "Kitaita (Kidaw'ida) marker-oracle: word validity and morpheme-slot analyses from data tables"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
# data/ at the repo root ships inside the wheel as the kitaita_oracle.data package
packages = ["kitaita_oracle", "kitaita_oracle.data"]
package-dir = { "kitaita_oracle" = "kitaita_oracle", "kitaita_oracle.data" = "data" }

[tool.setuptools.package-data]
"kitaita_oracle.data" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

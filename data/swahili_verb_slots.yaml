# Swahili verb slot inventories and paradigms (hand-written from reference grammar).
language: swh
source: Swahili reference grammar (Ashton 1944; Mohammed 2001)
template:
- NEG
- SM
- NEG2
- TAM
- REL
- OM
- ROOT
- EXT
- FV
notes:
- Standard Swahili reference grammar; the parallel parser for Kitaita's swahili_equivalent and for parsing
  Swahili words like 'ninaipenda'.
- 'Not covered: habitual hu-, monosyllabic-root ku- retention (anakula), applicative/causative/passive
  extensions (EXT is empty), general relative -o-.'
